# Hand-drawn scene layout for the competition camera (from camera.md + a reference frame).
# Coordinates are NORMALISED: x and y in [0, 1] of the frame width/height, so the file
# works at any resolution. Draw them with: python scripts/draw_scene.py samples/<video>.mp4
#
# Everything is optional. A missing entry disables only the rules that need it:
#   carriageway / lanes -> learned from trajectories instead (configs/scene_flow.npz)
#   approaches          -> red_light, stop_line
#   crosswalks          -> failure_to_yield (jaywalking then treats all road as "outside a crossing")
#   solid_lines         -> solid_line_crossing
#   movements           -> illegal_turn, illegal_u_turn

carriageway: []          # list of polygons; empty = use the learned road mask

crosswalks: []           # list of polygons

solid_lines: []          # list of polylines [[x, y], [x, y], ...]

approaches: []
# - name: northbound
#   stop_line: [[0.30, 0.62], [0.55, 0.60]]   # vehicles cross it moving in `direction`
#   direction: [0.0, -1.0]                     # image-space unit vector of travel
#   signal_roi: [0.71, 0.10, 0.73, 0.16]       # x1, y1, x2, y2 of the lamp housing
#   intersection: [[...], ...]                  # polygon; leaving it ends a red_light event

movements:
  u_turn_prohibited: []  # polygons where a U-turn is illegal
  forbidden: []          # [{from: <polygon>, to: <polygon>}] turns that are illegal
