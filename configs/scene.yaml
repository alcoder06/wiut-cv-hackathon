# Hand-drawn scene layout for the competition camera (from camera.md + a reference frame).
# Coordinates are NORMALISED: x and y in [0, 1] of the frame width/height, so the file
# works at any resolution. Draw them with: python scripts/draw_scene.py samples/<video>.mp4
#
# Everything is optional. A missing entry disables only the rules that need it:
#   carriageway / lanes -> learned from trajectories instead (configs/scene_flow.npz)
#   approaches          -> red_light, stop_line
#   crosswalks          -> failure_to_yield (jaywalking then treats all road as "outside a crossing")
#   solid_lines         -> solid_line_crossing
#   movements           -> illegal_turn, illegal_u_turn

carriageway: []          # list of polygons; empty = use the learned road mask

# Redrawn by the team on 27 Sep in the label desk's zone editor (dev/zones/zebra_path.png),
# mapped onto the frame with SIFT (332 matches, 0.5 px median error). The old outlines
# ran onto the kerb and over the island, so people waiting there looked like they were
# on the crossing.
crosswalks:
  # boulevard
  - [[0.5993, 0.5167], [0.5743, 0.5294], [0.2031, 0.6135], [0.1727, 0.5642], [0.5448, 0.4753]]
  # right
  - [[0.967, 0.4723], [0.6816, 0.5135], [0.6575, 0.5103], [0.6181, 0.4737], [0.6244, 0.4642], [0.9106, 0.4245], [0.9634, 0.4627]]
  # bottom
  - [[0.4714, 0.9921], [0.3157, 0.9991], [0.2486, 0.8489], [0.3873, 0.8314]]
  # lower_left
  - [[0.0912, 0.7009], [0.093, 0.6962], [0.1592, 0.6389], [0.2478, 0.7201], [0.2478, 0.7248], [0.1664, 0.7837], [0.0993, 0.72], [0.0939, 0.7121]]

# Traffic islands (refuges): a pedestrian standing here is never jaywalking and never
# counts against a car at a crossing. Checked on the tracks: over the whole of C3897 no
# vehicle drives through them, while 62 and 49 people pass through.
refuges:
  # island by the pole, between the boulevard and right crossings
  - [[0.5689, 0.4801], [0.6065, 0.4658], [0.6262, 0.4658], [0.6333, 0.4721], [0.6503, 0.5024], [0.6503, 0.5055], [0.6056, 0.5151], [0.5966, 0.5151], [0.5689, 0.4848]]
  # middle of the long lower-left zebra, between the pink islands
  - [[0.1682, 0.7773], [0.2755, 0.7042], [0.3784, 0.8283], [0.3801, 0.841], [0.2182, 0.8457], [0.1977, 0.8234]]

# Drawn by the team on C3897 at 211 s (dev/zones_marked.png): the solid lane lines on the
# boulevard approach before its stop line.
solid_lines:
  - [[0.1451, 0.3241], [0.2844, 0.4579]]
  - [[0.1870, 0.3014], [0.3529, 0.4444]]
  - [[0.2525, 0.3026], [0.4214, 0.4365]]

approaches:
  # Boulevard traffic from the upper left. Its own (gantry) lights are side-on and unreadable;
  # the left-pole lamp is readable and locked to the same 75 s cycle, but red ~4.5 s early and
  # green ~0.6 s late (measured: 126 stop-line crossings on C3897).
  - name: boulevard_in
    stop_line: [[0.1482, 0.4862], [0.4862, 0.4221]]
    direction: [0.880, 0.475]                   # image-space direction of travel (pixels)
    signal_roi: [0.1341, 0.4444, 0.1440, 0.4792] # left-pole lamp housing
    red_delay_sec: 5.0
    red_early_end_sec: 1.0
    intersection: [[0.2013, 0.6056], [0.6050, 0.5133], [0.9781, 0.4667], [0.9990, 0.4700],
                   [0.9990, 0.9990], [0.3500, 0.9990], [0.1500, 0.7400]]
# - name: northbound
#   stop_line: [[0.30, 0.62], [0.55, 0.60]]   # vehicles cross it moving in `direction`
#   direction: [0.0, -1.0]                     # image-space unit vector of travel
#   signal_roi: [0.71, 0.10, 0.73, 0.16]       # x1, y1, x2, y2 of the lamp housing
#   intersection: [[...], ...]                  # polygon; leaving it ends a red_light event

movements:
  u_turn_prohibited: []  # polygons where a U-turn is illegal
  forbidden: []          # [{from: <polygon>, to: <polygon>}] turns that are illegal
