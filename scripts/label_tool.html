<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event labeler</title>
<style>
  :root { --bg: #14161a; --panel: #1d2026; --fg: #e8e8e8; --muted: #8a9099; --accent: #4aa8ff; --warn: #ff6b5b; --ok: #5bd18b; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; padding: 12px; height: 100vh; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; height: auto; } }
  section { background: var(--panel); border-radius: 8px; padding: 10px; min-height: 0; }
  video { width: 100%; max-height: 62vh; background: #000; border-radius: 6px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
  button, select, input { background: #2a2e36; color: var(--fg); border: 1px solid #3a3f49; border-radius: 5px; padding: 5px 8px; font: inherit; }
  button:hover { border-color: var(--accent); }
  .big { font: 600 20px ui-monospace, monospace; }
  .muted { color: var(--muted); font-size: 12px; }
  #timeline { position: relative; height: 70px; background: #0d0f12; border-radius: 6px; cursor: pointer; margin-top: 8px; }
  #playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; pointer-events: none; }
  .seg { position: absolute; height: 9px; border-radius: 2px; opacity: .9; }
  #pending { position: absolute; top: 0; bottom: 0; background: rgba(255,255,0,.25); pointer-events: none; }
  #events { overflow: auto; max-height: calc(100vh - 260px); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 3px 4px; border-bottom: 1px solid #2a2e36; }
  td input { width: 72px; padding: 2px 4px; }
  tr.bad td { background: rgba(255,107,91,.15); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
  kbd { background: #2a2e36; border: 1px solid #3a3f49; border-radius: 3px; padding: 0 4px; font-size: 12px; }
  #classes button.on { border-color: var(--accent); background: #22344a; }
  #msg { color: var(--warn); min-height: 1em; }
</style>
</head>
<body>
<main>
  <section>
    <div class="row">
      <input type="file" id="file" accept="video/*">
      <label>fps <input id="fps" type="number" value="25" style="width:60px"></label>
      <span class="muted">Video plays straight from disk; nothing is uploaded.</span>
    </div>
    <video id="v" preload="auto"></video>
    <div class="row">
      <span class="big" id="clock">0.000 s</span>
      <span class="muted" id="frame">frame 0</span>
      <span class="muted" id="rate">1×</span>
      <span id="msg"></span>
    </div>
    <div id="timeline"><div id="pending"></div><div id="playhead"></div></div>
    <p class="muted">
      <kbd>Space</kbd> play/pause · <kbd>,</kbd>/<kbd>.</kbd> 1 frame · <kbd>←</kbd>/<kbd>→</kbd> 2 s ·
      <kbd>Shift</kbd>+<kbd>←</kbd>/<kbd>→</kbd> 10 s · <kbd>↑</kbd>/<kbd>↓</kbd> speed ·
      <kbd>S</kbd> mark start · <kbd>E</kbd> mark end (adds event) · <kbd>Esc</kbd> cancel start ·
      <kbd>1</kbd>–<kbd>9</kbd>, <kbd>0</kbd>, <kbd>Q</kbd>–<kbd>R</kbd> pick class
    </p>
  </section>
  <section>
    <div id="classes" class="row"></div>
    <div class="row">
      <button id="export">Export labels JSON</button>
      <label><button onclick="document.getElementById('imp').click()">Import JSON</button>
        <input type="file" id="imp" accept=".json" hidden></label>
      <span class="muted" id="count"></span>
    </div>
    <div id="events"><table><tbody id="tbody"></tbody></table></div>
  </section>
</main>
<script>
const CLASSES = ["accident","near_miss","red_light","wrong_way","illegal_u_turn","stopped_vehicle",
  "jaywalking","failure_to_yield","illegal_turn","solid_line_crossing","stop_line","congestion",
  "road_obstacle","fire_smoke"];
const KEYS = ["1","2","3","4","5","6","7","8","9","0","q","w","e","r"];
const COLOURS = ["#ff4d4d","#ffa94d","#ff6bcb","#ffd43b","#a9e34b","#4dabf7","#63e6be",
  "#b197fc","#f783ac","#74c0fc","#e599f7","#ced4da","#c0eb75","#ff8787"];
const v = document.getElementById('v'), tl = document.getElementById('timeline');
let cls = 0, pendingStart = null, events = [], videoName = null;

const fps = () => parseFloat(document.getElementById('fps').value) || 25;
const r3 = x => Math.round(x * 1000) / 1000;
const store = () => { try { localStorage.setItem('labels:' + videoName, JSON.stringify(events)); } catch (e) {} };
const restore = () => { try { return JSON.parse(localStorage.getItem('labels:' + videoName)) || []; } catch (e) { return []; } };
const say = t => { document.getElementById('msg').textContent = t; if (t) setTimeout(() => say(''), 4000); };

// class picker
const box = document.getElementById('classes');
CLASSES.forEach((c, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<span class="dot" style="background:${COLOURS[i]}"></span>${KEYS[i]} ${c}`;
  b.onclick = () => pick(i);
  box.appendChild(b);
});
function pick(i) { cls = i; [...box.children].forEach((b, j) => b.classList.toggle('on', j === i)); }
pick(0);

document.getElementById('file').onchange = e => {
  const f = e.target.files[0];
  videoName = f.name;
  v.src = URL.createObjectURL(f);
  events = restore();
  render();
};
v.onerror = () => say('Browser cannot play this codec (probably HEVC). Make an H.264 proxy with ffmpeg (see README).');

function mark(kind) {
  if (!videoName) return say('Open a video first');
  const t = r3(v.currentTime);
  if (kind === 's') { pendingStart = t; say(`start ${t}s for ${CLASSES[cls]}`); }
  else if (pendingStart === null) say('Press S at the start first');
  else if (t <= pendingStart) say('End must be after start');
  else { events.push([pendingStart, t, CLASSES[cls]]); pendingStart = null; render(); }
  drawPending();
}

document.onkeydown = e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'file') return;
  const k = e.key.toLowerCase(), step = 1 / fps();
  if (k === ' ') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
  else if (k === ',') { v.pause(); v.currentTime = Math.max(0, v.currentTime - step); }
  else if (k === '.') { v.pause(); v.currentTime += step; }
  else if (k === 'arrowleft') { e.preventDefault(); v.currentTime -= e.shiftKey ? 10 : 2; }
  else if (k === 'arrowright') { e.preventDefault(); v.currentTime += e.shiftKey ? 10 : 2; }
  else if (k === 'arrowup') { e.preventDefault(); v.playbackRate = Math.min(8, v.playbackRate * 2); }
  else if (k === 'arrowdown') { e.preventDefault(); v.playbackRate = Math.max(0.125, v.playbackRate / 2); }
  else if (k === 's') mark('s');
  else if (k === 'e') mark('e');
  else if (k === 'escape') { pendingStart = null; drawPending(); }
  else if (KEYS.includes(k)) pick(KEYS.indexOf(k));
};

// same-class overlaps are illegal in the ground truth: the FAQ says merge them into one
function overlapping() {
  const bad = new Set();
  events.forEach((a, i) => events.forEach((b, j) => {
    if (i < j && a[2] === b[2] && a[0] < b[1] && b[0] < a[1]) { bad.add(i); bad.add(j); }
  }));
  return bad;
}

function render() {
  events.sort((a, b) => a[0] - b[0]);
  const bad = overlapping(), tb = document.getElementById('tbody');
  tb.innerHTML = '';
  events.forEach((ev, i) => {
    const tr = document.createElement('tr');
    if (bad.has(i)) tr.className = 'bad';
    const ci = CLASSES.indexOf(ev[2]);
    tr.innerHTML = `<td><span class="dot" style="background:${COLOURS[ci]}"></span>${ev[2]}</td>
      <td><input value="${ev[0]}" data-i="${i}" data-k="0"></td>
      <td><input value="${ev[1]}" data-i="${i}" data-k="1"></td>
      <td><button data-go="${i}">▶</button> <button data-del="${i}">✕</button></td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll('input').forEach(inp => inp.onchange = () => {
    events[+inp.dataset.i][+inp.dataset.k] = r3(parseFloat(inp.value)); render();
  });
  tb.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { v.currentTime = events[+b.dataset.go][0]; });
  tb.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { events.splice(+b.dataset.del, 1); render(); });
  document.getElementById('count').textContent =
    `${events.length} events` + (bad.size ? ` · ${bad.size} overlap (same class) — merge them` : '');
  drawTimeline();
  store();
}

function drawTimeline() {
  tl.querySelectorAll('.seg').forEach(s => s.remove());
  const d = v.duration || 1;
  events.forEach(([s, e, c]) => {
    const i = CLASSES.indexOf(c), seg = document.createElement('div');
    seg.className = 'seg';
    Object.assign(seg.style, { left: `${100 * s / d}%`, width: `${Math.max(0.2, 100 * (e - s) / d)}%`,
      top: `${4 + (i % 7) * 9}px`, background: COLOURS[i] });
    seg.title = `${c} ${s}–${e}`;
    tl.appendChild(seg);
  });
}
function drawPending() {
  const p = document.getElementById('pending'), d = v.duration || 1;
  if (pendingStart === null) { p.style.width = 0; return; }
  p.style.left = `${100 * pendingStart / d}%`;
  p.style.width = `${Math.max(0, 100 * (v.currentTime - pendingStart) / d)}%`;
}
tl.onclick = e => { const r = tl.getBoundingClientRect(); v.currentTime = (e.clientX - r.left) / r.width * v.duration; };
v.ontimeupdate = () => {
  document.getElementById('clock').textContent = `${v.currentTime.toFixed(3)} s`;
  document.getElementById('frame').textContent = `frame ${Math.round(v.currentTime * fps())}`;
  document.getElementById('rate').textContent = `${v.playbackRate}×`;
  document.getElementById('playhead').style.left = `${100 * v.currentTime / (v.duration || 1)}%`;
  drawPending();
};
v.onloadedmetadata = drawTimeline;

document.getElementById('export').onclick = () => {
  if (overlapping().size) return say('Fix same-class overlaps first (merge into one segment)');
  const out = { [videoName]: { duration: r3(v.duration), fps: fps(), events } };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' }));
  a.download = videoName.replace(/\.[^.]+$/, '') + '_labels.json';
  a.click();
};
document.getElementById('imp').onchange = async e => {
  const data = JSON.parse(await e.target.files[0].text());
  const entry = data[videoName] || Object.values(data)[0];
  if (entry) {
    events = entry.events;
    if (entry.fps) document.getElementById('fps').value = entry.fps;
    render(); say(`imported ${events.length} events`);
  }
};
</script>
</body>
</html>
