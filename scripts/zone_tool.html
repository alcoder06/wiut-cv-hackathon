<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zone tool</title>
<style>
  :root { --bg: #111; --fg: #eee; --accent: #4af; }
  body { margin: 0; font: 14px system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { padding: 8px 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  canvas { max-width: 100%; cursor: crosshair; display: block; }
  textarea { width: 100%; height: 220px; background: #000; color: #9f9; font: 12px monospace; }
  button, select { background: #333; color: var(--fg); border: 1px solid #555; padding: 4px 8px; }
</style>
</head>
<body>
<header>
  <input type="file" id="file" accept="image/*">
  <select id="kind">
    <option value="carriageway">carriageway (polygon)</option>
    <option value="crosswalks">crosswalk (polygon)</option>
    <option value="solid_lines">solid line (polyline)</option>
    <option value="stop_line">approach: stop line (2 points)</option>
    <option value="signal_roi">approach: signal ROI (2 corners)</option>
    <option value="intersection">approach: intersection (polygon)</option>
    <option value="u_turn_prohibited">no-U-turn zone (polygon)</option>
  </select>
  <button id="finish">Finish shape (Enter)</button>
  <button id="undo">Undo point (Backspace)</button>
  <span>Click to add points. Output is normalised [0-1] YAML for configs/scene.yaml.</span>
</header>
<canvas id="c"></canvas>
<textarea id="out" readonly></textarea>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const img = new Image();
let shapes = [], current = [];
document.getElementById('file').onchange = e => { img.src = URL.createObjectURL(e.target.files[0]); };
img.onload = () => { c.width = img.width; c.height = img.height; draw(); };
c.onclick = e => {
  const r = c.getBoundingClientRect();
  current.push([(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]);
  draw();
};
const finish = () => {
  if (current.length) shapes.push({ kind: document.getElementById('kind').value, pts: current });
  current = []; draw(); render();
};
document.getElementById('finish').onclick = finish;
document.getElementById('undo').onclick = () => { current.pop(); draw(); };
document.onkeydown = e => {
  if (e.key === 'Enter') finish();
  if (e.key === 'Backspace') { current.pop(); draw(); }
};
function draw() {
  ctx.drawImage(img, 0, 0);
  ctx.lineWidth = 3;
  for (const s of [...shapes, { kind: 'current', pts: current }]) {
    ctx.strokeStyle = s.kind === 'current' ? '#ff0' : '#4af';
    ctx.beginPath();
    s.pts.forEach(([x, y], i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, x * c.width, y * c.height));
    ctx.stroke();
  }
}
const f = p => `[${p[0].toFixed(4)}, ${p[1].toFixed(4)}]`;
const list = pts => `[${pts.map(f).join(', ')}]`;
function render() {
  const by = k => shapes.filter(s => s.kind === k);
  const lines = [];
  for (const k of ['carriageway', 'crosswalks', 'solid_lines']) {
    lines.push(`${k}:`);
    by(k).forEach(s => lines.push(`  - ${list(s.pts)}`));
  }
  lines.push('approaches:  # fill in name + direction for each');
  const stops = by('stop_line'), rois = by('signal_roi'), boxes = by('intersection');
  stops.forEach((s, i) => {
    lines.push(`  - name: approach_${i + 1}`, `    stop_line: ${list(s.pts.slice(0, 2))}`,
               `    direction: [0.0, -1.0]   # EDIT: image-space direction of travel`);
    if (rois[i]) { const [a, b] = rois[i].pts; lines.push(`    signal_roi: [${a[0].toFixed(4)}, ${a[1].toFixed(4)}, ${b[0].toFixed(4)}, ${b[1].toFixed(4)}]`); }
    if (boxes[i]) lines.push(`    intersection: ${list(boxes[i].pts)}`);
  });
  lines.push('movements:', '  u_turn_prohibited:');
  by('u_turn_prohibited').forEach(s => lines.push(`    - ${list(s.pts)}`));
  lines.push('  forbidden: []');
  document.getElementById('out').value = lines.join('\n');
}
</script>
</body>
</html>
